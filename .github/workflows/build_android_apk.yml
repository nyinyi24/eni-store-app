name: Build ENI Store Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'FastAPI Server URL (e.g. https://your-domain.com/api)'
        required: false
        default: 'http://13.228.96.27:8000/api'

jobs:
  build-apk:
    name: Build Release APK on GitHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 🛠 Generate Android Platform Files (if not committed)
        working-directory: ./mobile_app
        run: |
          flutter create --platforms=android --org com.enistore.premium .
          # Ensure Cleartext HTTP traffic & Internet permissions are enabled in AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      - name: 📦 Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: 🏗 Build Release APK
        working-directory: ./mobile_app
        run: |
          API_URL="${{ github.event.inputs.api_base_url || vars.API_BASE_URL || 'http://13.228.96.27:8000/api' }}"
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"

      - name: 📤 Upload APK Artifact (Download from Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: ENI-Premium-Store-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
