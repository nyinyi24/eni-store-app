name: Build ENI Store Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend FastAPI URL (e.g. http://13.228.96.27:8000/api)'
        required: true
        default: 'http://13.228.96.27:8000/api'
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build_android_apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files & Inject HTTP Cleartext Permissions
        working-directory: mobile_app
        run: |
          flutter create --platforms=android --org com.enistore.app --project-name eni_store_app .
          python3 - << 'EOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          # 1. Add Internet & Media Permissions for API and Payment Screenshot Upload
          permissions = """<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>"""

          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  permissions,
                  1
              )

          # 2. Enable HTTP Cleartext Traffic & Set App Label
          if 'android:usesCleartextTraffic="true"' not in content:
              content = content.replace(
                  "<application",
                  '<application\n        android:usesCleartextTraffic="true"',
                  1
              )

          content = content.replace('android:label="eni_store_app"', 'android:label="ENI Store"')

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("=== Updated AndroidManifest.xml ===")
          print(content)
          EOF

      - name: Install Flutter Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile_app
        run: |
          API_URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$API_URL" ]; then
            API_URL="http://13.228.96.27:8000/api"
          fi
          echo "Building APK with API_BASE_URL=$API_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENI-Premium-Store-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error